[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must use sh -c so $PORT expands; bare gunicorn sees literal "$PORT"
startCommand = "sh -c 'gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 1 --threads 4 --timeout 120 --preload src.api:app'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
